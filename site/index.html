<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Производственный аналитик</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 0 20px; }
        textarea { width: 100%; height: 80px; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
        #response { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; }
        .examples { margin-top: 20px; color: #555; }
        .example { cursor: pointer; color: #0066cc; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Производственный аналитик</h1>
    <p>Задайте вопрос:</p>
    <textarea id="queryInput" placeholder="Например: КИМ станка 3.6_АРМА-S600 за 15 сентября 2026"></textarea>
    <button onclick="sendQuery()">Отправить</button>
    <div id="response"></div>
    <div class="examples">
        <p>Примеры запросов:</p>
        <ul>
            <li><span class="example" onclick="setExample('КИМ станка 3.6_АРМА-S600 за 15 сентября 2026')">КИМ станка 3.6_АРМА-S600 за 15 сентября 2026</span></li>
            <li><span class="example" onclick="setExample('Простои в ночную смену 27 декабря')">Простои в ночную смену 27 декабря</span></li>
            <li><span class="example" onclick="setExample('Работа оператора Комов Александр Викторович')">Работа оператора Комов Александр Викторович</span></li>
        </ul>
    </div>

    <script>
        function setExample(text) {
            document.getElementById('queryInput').value = text;
        }

        async function sendQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                alert('Введите запрос');
                return;
            }
            document.getElementById('response').innerHTML = '⏳ Обработка...';
            try {
                const response = await fetch('/api/analyze2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                document.getElementById('response').innerHTML = data.answer || 'Ответ не получен';
            } catch (error) {
                document.getElementById('response').innerHTML = '⚠️ Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
